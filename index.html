<style>
:root{

}

  --accent:#4f8fce;--accent2:#6aa6e0;--accent-soft:#1d2d3e;--accent-ink:#0f1720;
  --orange:#f0893f;--orange-soft:#3a2415;--go:#56c088;--go-soft:#17301f;--nogo:#ef8278;--nogo-soft:#361b18;--grid:#243341;
  --fill-slab:#20374d;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0f1720;--surface:#17212c;--surface2:#1f2b38;--ink:#e4ebf1;--muted:#93a3b1;--line:#2c3b49;--accent:#4f8fce;--accent2:#6aa6e0;--accent-soft:#1d2d3e;--accent-ink:#0f1720;--orange:#f0893f;--orange-soft:#3a2415;--go:#56c088;--go-soft:#17301f;--nogo:#ef8278;--nogo-soft:#361b18;--grid:#243341;--fill-slab:#20374d;color-scheme:dark;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0) + 64px)}

body{margin:0;color:var(--ink);font:16px/1.55 var(--fb);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}

.brand{font:700 20px var(--fd);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px}

.mono{font-family:var(--fm)}.small{font-size:13px}.dim{color:var(--muted)}

.display{font-family:var(--fd);font-weight:700;font-size:clamp(56px,13vw,120px);line-height:.9;text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;color:var(--accent)}
.display::after{content:"";display:block;width:84px;height:7px;background:var(--orange);margin-top:10px}
.lead{max-width:64ch;font-size:17px;margin:0 0 16px}
.progress{display:flex;align-items:center;gap:12px;margin:4px 0 18px;max-width:560px}
.bar{flex:1;height:10px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.btn{font:600 15px var(--fb);padding:10px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px;border-radius:2px}

.stepper .st{display:flex;flex-direction:column}.stepper b{font:600 14px var(--fb)}.stepper small{color:var(--muted);font-size:11px}
.panel{background:var(--surface);border:1.5px solid var(--line);padding:20px;margin-bottom:14px;border-radius:2px}
@media (max-width:520px){.panel{padding:14px}}
.note{color:var(--muted);max-width:68ch;margin-top:0}
.scenario{font-size:18px;max-width:64ch;border-left:4px solid var(--accent);padding-left:14px}
.item{margin-top:14px}.item .q{font-size:19px;margin-bottom:12px;line-height:1.5}
input[type=text],textarea{width:100%;font:17px var(--fm);padding:11px 12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:2px}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

.fb:empty{display:none}

.fb.go{background:var(--go-soft);border-left:5px solid var(--go)}.fb.go strong{color:var(--go)}
.fb.nogo{background:var(--nogo-soft);border-left:5px solid var(--nogo)}.fb.nogo strong{color:var(--nogo)}
.fb.err{background:var(--orange-soft);border-left:5px solid var(--orange)}
.fb strong{font:700 17px var(--fd);letter-spacing:.03em}
.sol{margin-top:6px}
.gni{max-width:72ch}
.gni .rule{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;margin:12px 0;line-height:1.7}
.gni .ex{font-family:var(--fm);font-size:15px;background:var(--surface2);padding:12px 14px;margin:12px 0;line-height:1.7;overflow-x:auto;border-left:3px solid var(--orange)}
.why{font-size:18px;max-width:64ch}
.prompts{color:var(--muted);padding-left:20px}
/* models */
.model{border:1.5px solid var(--line);background:var(--surface2);padding:16px;margin:10px 0;border-radius:2px}
.mhint{color:var(--muted);font-size:14px;margin:0 0 12px}
.msl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 18px;margin:6px 0 14px}
.ms{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:2px 10px;align-items:center}
.ms>span{font-size:13px;color:var(--muted)}
.ms>output{justify-self:end;font-size:14px;font-weight:500;color:var(--accent2)}
.ms>input{grid-column:span 2;accent-color:var(--accent);min-height:28px}
.ro{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.rorow{display:flex;justify-content:space-between;gap:12px;background:var(--surface);padding:8px 12px}
.rok{color:var(--muted);font-size:14px}.rov{font-weight:600;font-size:15px}
.mviz svg{display:block;margin:0 auto 10px}
.dim-t{fill:var(--muted);font-size:9px;font-family:var(--fm)}
.wcwrap{margin:4px 0 12px}
.wcbar{height:26px;border:1.5px solid var(--line);background:linear-gradient(90deg,var(--nogo-soft),var(--go-soft));position:relative}
.wcbar::after{content:"";position:absolute;top:-4px;bottom:-4px;left:var(--p);width:3px;background:var(--ink)}
.barsel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.barbtn{font:600 15px var(--fm);min-width:44px;min-height:40px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:2px}
.barbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.gwrap{position:relative;margin:4px 0 16px}
.gauge{height:26px;border:1.5px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.gauge::after{content:"";position:absolute;inset:0;width:var(--v);background:var(--orange);transition:width .1s}
.gauge.pass::after{background:var(--go)}
.gmark{position:absolute;top:-2px;bottom:-2px;border-left:2px dashed var(--ink);font:600 11px var(--fm);padding-left:3px;color:var(--ink)}
.stat{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0}
.dots{display:flex;gap:6px}.dot{width:16px;height:16px;border:2px solid var(--line);background:transparent}
.dot.g{background:var(--go);border-color:var(--go)}.dot.n{background:var(--nogo);border-color:var(--nogo)}
.hint{background:var(--orange-soft);padding:10px 14px;margin-top:10px}
.banner{background:var(--go-soft);border:2px solid var(--go);padding:14px;margin-top:18px}
.banner strong{font:700 20px var(--fd);color:var(--go);letter-spacing:.03em}
.aar{margin-top:12px}.lnav{margin-top:6px}
.ph{font-size:clamp(34px,6vw,52px);text-transform:uppercase}
.jcard h3{margin-top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jl{font:600 13px var(--fb);color:var(--muted);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.03em}
.jt{margin:0;white-space:pre-wrap}.copybox{margin-top:10px;min-height:180px}
[hidden]{display:none!important}

<body>
<header class="top"><div class="topin">
  <button class="brand" onclick="go('home')">Field Ops</button>
  <nav aria-label="Main">
    <button data-v="home">Modules</button>
    <button data-v="journal">Field log</button>
    <button data-v="method">Method</button>
  </nav>
</div></header>
<main id="app"></main>
<script>
/* ===== helpers ===== */
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rf=(a,b,s=1)=>Math.round((a+Math.random()*(b-a))/s)*s;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const r0=v=>Math.round(v);
const r1=v=>Math.round(v*10)/10;
const r2=v=>Math.round(v*100)/100;
const money=v=>'$'+Math.round(v).toLocaleString('en-US');
const money2=v=>'$'+(Math.round(v*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const commas=v=>Math.round(v).toLocaleString('en-US');
const pct=v=>r1(v)+'%';
const clean=s=>String(s).replace(/[,$%]/g,'').replace(/\s+/g,'').replace(/[−–]/g,'-');
function numVal(s){const t=clean(s);if(!t)throw 'Enter a number first.';if(!/^-?\d*\.?\d+$/.test(t))throw 'Enter a plain number.';const v=parseFloat(t);if(!isFinite(v))throw 'That isn’t a number.';return v;}
function mc(opts,correct){const arr=opts.map((o,i)=>({o,c:i===correct}));for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return {options:arr.map(a=>a.o),ans:arr.findIndex(a=>a.c)};}
function close(v,a,tol){return Math.abs(v-a)<=(tol!=null?tol:Math.max(0.01,Math.abs(a)*0.01))+1e-9;}
function check(item,input){
  try{
    if(item.type==='choice')return {ok:input===item.ans};
    if(item.type==='fields'){const vals=input.map((s,i)=>{if(!String(s).trim())throw 'Fill in every box.';return numVal(s)});const bad=item.fields.filter((f,i)=>!close(vals[i],f.ans,f.tol)).map(f=>f.label);return {ok:!bad.length,msg:bad.length?'Check: '+bad.join(', ')+'.':''};}
    const raw=String(input).trim();if(!raw)throw 'Enter an answer first.';
    if(item.type==='num')return {ok:close(numVal(raw),item.ans,item.tol)};
    if(item.type==='text'){const n=clean(raw).toLowerCase();return {ok:item.accept.some(a=>n===clean(a).toLowerCase())};}
  }catch(e){return {err:typeof e==='string'?e:'Couldn’t read that.'}}
  return {err:'Unknown item.'};
}
/* rebar: # -> dia(in), area(in^2), weight(plf) */
const BAR={3:[0.375,0.11,0.376],4:[0.5,0.20,0.668],5:[0.625,0.31,1.043],6:[0.75,0.44,1.502],7:[0.875,0.60,2.044],8:[1.0,0.79,2.670],9:[1.128,1.00,3.400],10:[1.27,1.27,4.303],11:[1.41,1.56,5.313]};

/* ===== phases / modules =====
   Each module maps to a real MTSU course. ELM: ce, gni, dev, model(optional interactive), gen(level) */
const PHASES=[
{name:'Plans and field math',course:'CCM 2060 / CMT 2100',lessons:[

{id:'scale',course:'CCM 2060',title:'Reading scale off a drawing',bloom:'Apply',
 hint:'Multiply the measured length by the scale’s feet-per-inch. At 1/4"=1\'-0", every inch on paper is 4 feet.',
 ce:{text:'A wall measures 7 inches on a sheet drawn at 1/4" = 1\'-0". How long is the wall in real life?',item:{q:'Actual length (feet) = ?',type:'num',ans:28,sol:'At 1/4" = 1\'-0", one inch of paper equals 4 feet. 7 in × 4 ft/in = <b>28 ft</b>.'}},
 gni:`<p>An architectural scale states how many feet one inch of paper stands for.</p><div class="rule"><b>Common scales:</b> 1/8" = 1'-0" means 1 in = 8 ft. 1/4" = 1'-0" means 1 in = 4 ft. 1/2" = 1'-0" means 1 in = 2 ft. 3/16" and 3/32" show up on site plans.<br><b>Rule:</b> actual length = paper length × (feet per inch).</div><div class="ex">A 3.5 in line at 1/8" = 1'-0"<br>3.5 in × 8 ft/in = 28 ft</div>`,
 dev:'Every quantity you pull off a drawing starts with reading scale right. Get the scale wrong and the whole takeoff is wrong.',
 model:'scale',
 gen(d){const scales=[['1/8\" = 1\'-0\"',8],['1/4\" = 1\'-0\"',4],['1/2\" = 1\'-0\"',2],['3/16\" = 1\'-0\"',16/3],['1\" = 20\'',20],['1\" = 30\'',30]];
  const [lab,fpi]=pick(d===1?scales.slice(0,3):scales),inch=d===1?ri(2,9):rf(1.5,9.5,0.25),len=inch*fpi;
  if(d===3&&Math.random()<.5){const area=r0(len)* (r0(inch*fpi)); // not used
  }
  return {q:`A dimension measures ${inch} in on a sheet at ${lab}. What is the actual length, in feet?`,type:'num',ans:len,tol:Math.max(0.5,len*0.01),sol:`${lab} means 1 in = ${r2(fpi)} ft. ${inch} × ${r2(fpi)} = <b>${r1(len)} ft</b>.`};}},

{id:'area',course:'CMT 2100',title:'Area and volume takeoff',bloom:'Apply',
 hint:'Area = length × width. Slab volume in cubic yards = length × width × thickness(ft) ÷ 27.',
 ce:{text:'A commercial slab is 90 ft by 60 ft, poured 6 inches thick. Concrete is ordered by the cubic yard. How many cubic yards, before any waste allowance?',item:{q:'Cubic yards = ?',type:'num',ans:100,tol:.5,sol:'6 in = 0.5 ft. 90 × 60 × 0.5 = 2,700 ft³. 2,700 ÷ 27 = <b>100 cy</b>.'}},
 gni:`<div class="rule"><b>Area</b> (ft²) = length × width.<br><b>Volume</b> (ft³) = area × thickness, with thickness in feet (inches ÷ 12).<br><b>Cubic yards</b> = ft³ ÷ 27. There are 27 ft³ in a cubic yard.</div><div class="ex">120 ft × 40 ft slab, 4 in thick<br>4 in = 0.333 ft<br>120 × 40 × 0.333 = 1,600 ft³<br>1,600 ÷ 27 = 59.3 cy</div>`,
 dev:'Concrete, fill, base stone, and asphalt are all bought by the cubic yard or ton. This is the most-used takeoff you own.',
 model:'slab',
 gen(d){const L=ri(20,140),W=ri(15,90),th=pick(d===1?[4,6]:[4,5,6,8,10,12]);
  if(d<3||Math.random()<.5){const cy=L*W*(th/12)/27;return {q:`A slab is ${L} ft × ${W} ft at ${th} in thick. How many cubic yards?`,type:'num',ans:cy,tol:Math.max(.3,cy*0.01),sol:`${th} in = ${r2(th/12)} ft. ${L} × ${W} × ${r2(th/12)} = ${commas(L*W*th/12)} ft³. ÷ 27 = <b>${r1(cy)} cy</b>.`};}
  const waste=pick([5,8,10]),cy=L*W*(th/12)/27,ord=cy*(1+waste/100);
  return {q:`A ${L} ft × ${W} ft slab at ${th} in needs a ${waste}% waste allowance. How many cubic yards do you order?`,type:'num',ans:ord,tol:Math.max(.3,ord*0.01),sol:`Base: ${L}×${W}×${r2(th/12)}/27 = ${r1(cy)} cy. +${waste}%: ${r1(cy)} × ${r2(1+waste/100)} = <b>${r1(ord)} cy</b>.`};}},

{id:'pyth',course:'CMT 2100',title:'Squaring with the 3-4-5 method',bloom:'Apply',
 hint:'A right triangle satisfies a² + b² = c². Any 3-4-5 multiple makes a square corner.',
 ce:{text:'You lay out a building corner. One leg runs 12 ft, the other 16 ft. To confirm the corner is square, what should the diagonal measure?',item:{q:'Diagonal (feet) = ?',type:'num',ans:20,sol:'√(12² + 16²) = √(144 + 256) = √400 = <b>20 ft</b>. That’s a 3-4-5 corner scaled ×4.'}},
 gni:`<div class="rule"><b>Pythagorean theorem:</b> a² + b² = c². The diagonal (hypotenuse) c = √(a² + b²).</div><div class="rule"><b>3-4-5 rule:</b> if two legs are 3 and 4 (or any multiple, like 6-8 or 12-16), a square corner reads 5 (or 10, or 20) on the diagonal. Crews use 3-4-5 to check corners without a transit.</div><div class="ex">Legs 9 ft and 12 ft<br>√(81 + 144) = √225 = 15 ft</div>`,
 dev:'Squaring foundations, checking formwork, and running diagonals to verify a rectangle all come from this. A corner that isn’t square throws off everything stacked on it.',
 gen(d){if(d===1){const t=pick([3,4,5,6,8]),a=3*t,b=4*t,c=5*t;return {q:`A corner has legs of ${a} ft and ${b} ft. What should the diagonal read if it’s square?`,type:'num',ans:c,sol:`√(${a}² + ${b}²) = √${a*a+b*b} = <b>${c} ft</b> (a 3-4-5 corner).`};}
  const a=ri(6,40),b=ri(6,40),c=Math.sqrt(a*a+b*b);return {q:`A diagonal brace spans a rectangle ${a} ft × ${b} ft. How long is the brace?`,type:'num',ans:c,tol:.05,sol:`√(${a}² + ${b}²) = √${a*a+b*b} = <b>${r2(c)} ft</b>.`};}}
]},

{name:'Estimating and bidding',course:'CMT 3100 / CMT 4200',lessons:[

{id:'unit',course:'CMT 3100',title:'Unit-cost estimating',bloom:'Apply',
 hint:'Extended cost = quantity × unit cost. Keep units matched: cy with $/cy, sf with $/sf.',
 ce:{text:'You take off 340 cubic yards of concrete. Your unit cost, installed, is $165 per cubic yard. What’s the extended line-item cost?',item:{q:'Extended cost = ?',type:'num',ans:56100,tol:1,sol:'340 cy × $165/cy = <b>$56,100</b>.'}},
 gni:`<div class="rule"><b>Extended cost</b> = quantity × unit cost. This is the backbone of a unit-price estimate.</div><div class="rule">A unit cost usually bundles material, labor, and equipment for one unit of work. Match the unit: concrete in cy, formwork in sf of contact area, rebar in lb or tons, drywall in sf.</div><div class="ex">4,800 sf of drywall at $2.75/sf<br>4,800 × 2.75 = $13,200</div>`,
 dev:'A full estimate is hundreds of these lines summed up. Master the single line and the estimate is just bookkeeping.',
 model:'unit',
 gen(d){const items=[['concrete','cy',ri(80,500),rf(140,210,5)],['formwork','sf',ri(600,4000),rf(6,14,0.25)],['rebar','lb',ri(2000,20000),rf(.9,1.6,.05)],['drywall','sf',ri(2000,15000),rf(2,4,.25)],['CMU block','sf',ri(800,6000),rf(11,22,.5)],['structural steel','ton',ri(10,120),rf(2400,3600,50)]];
  const [n,u,q,c]=pick(items);
  if(d<3)return {q:`Extend this line: ${commas(q)} ${u} of ${n} at ${money2(c)}/${u}.`,type:'num',ans:q*c,tol:Math.max(1,q*c*0.005),sol:`${commas(q)} × ${money2(c)} = <b>${money(q*c)}</b>.`};
  const oh=pick([10,12,15]),prof=pick([5,8,10]),base=q*c,tot=base*(1+oh/100)*(1+prof/100);
  return {q:`A line item of ${commas(q)} ${u} at ${money2(c)}/${u} carries ${oh}% overhead, then ${prof}% profit on top. What’s the marked-up total?`,type:'num',ans:tot,tol:Math.max(1,tot*0.005),sol:`Base ${money(base)}. ×${r2(1+oh/100)} = ${money(base*(1+oh/100))}. ×${r2(1+prof/100)} = <b>${money(tot)}</b>.`};}},

{id:'markup',course:'CMT 4200',title:'Overhead, profit and markup',bloom:'Analyze',
 hint:'Markup on cost: price = cost × (1 + markup). Margin is profit ÷ price. They’re not the same percentage.',
 ce:{text:'Your job cost is $400,000. You want a 20% markup on cost to cover overhead and profit. What do you bid?',item:{q:'Bid price = ?',type:'num',ans:480000,tol:1,sol:'$400,000 × 1.20 = <b>$480,000</b>. The $80,000 markup is 16.7% of the bid, which is your margin.'}},
 gni:`<div class="rule"><b>Markup</b> is a percent added to cost: price = cost × (1 + markup%).<br><b>Margin</b> is profit as a percent of price: margin = (price − cost) ÷ price.</div><div class="rule">To hit a target margin, divide: price = cost ÷ (1 − margin%). A 20% markup is only a 16.7% margin, which trips up a lot of estimators.</div><div class="ex">Cost $90,000, target margin 25%<br>price = 90,000 ÷ (1 − 0.25) = 90,000 ÷ 0.75 = $120,000</div>`,
 dev:'The gap between markup and margin is where contractors quietly lose money. Bidding a 15% markup when the boss wanted a 15% margin leaves profit on the table every job.',
 gen(d){const cost=ri(50,900)*1000;
  if(d===1){const m=pick([10,15,20,25]);return {q:`Job cost is ${money(cost)}. Apply a ${m}% markup. What’s the bid?`,type:'num',ans:cost*(1+m/100),tol:1,sol:`${money(cost)} × ${r2(1+m/100)} = <b>${money(cost*(1+m/100))}</b>.`};}
  if(d===2){const marg=pick([10,15,20,25,30]),price=cost/(1-marg/100);return {q:`Job cost is ${money(cost)}. You need a ${marg}% profit margin (percent of the bid). What’s the bid?`,type:'num',ans:price,tol:2,sol:`price = cost ÷ (1 − margin) = ${money(cost)} ÷ ${r2(1-marg/100)} = <b>${money(price)}</b>.`};}
  const m=pick([15,20,25]),price=cost*(1+m/100),marg=(price-cost)/price*100;return {q:`You bid a ${money(cost)} job with a ${m}% markup on cost. What profit margin (percent of the bid) does that actually give you?`,type:'num',ans:marg,tol:.2,sol:`Bid = ${money(price)}. Margin = (${money(price)} − ${money(cost)}) ÷ ${money(price)} = <b>${pct(marg)}</b>.`};}},

{id:'prod',course:'CMT 3100',title:'Labor productivity and crew cost',bloom:'Apply',
 hint:'Labor hours = quantity ÷ production rate. Labor cost = hours × crew wage.',
 ce:{text:'A crew places rebar at 500 lb per hour. You have 9,000 lb to place, and the crew runs $320 per hour, all-in. What’s the labor cost for the rebar?',item:{q:'Labor cost = ?',type:'num',ans:5760,tol:1,sol:'9,000 ÷ 500 = 18 crew-hours. 18 × $320 = <b>$5,760</b>.'}},
 gni:`<div class="rule"><b>Labor hours</b> = quantity ÷ production rate (units per hour).<br><b>Labor cost</b> = labor hours × crew rate ($/hr).<br><b>Unit labor cost</b> = crew rate ÷ production rate = $ per unit.</div><div class="ex">Masons lay 150 block/day, crew costs $1,800/day<br>unit cost = 1,800 ÷ 150 = $12/block</div>`,
 dev:'Productivity is the number estimators argue over most, because labor is the riskiest line. A 10% miss on the rate is a 10% miss on the single biggest cost on the job.',
 model:'prod',
 gen(d){const jobs=[['place concrete','cy',rf(8,16),ri(60,400)],['lay CMU block','block',ri(120,220),ri(300,2500)],['hang drywall','sf',ri(60,120),ri(2000,12000)],['set formwork','sf',ri(25,60),ri(800,4000)],['frame wall','lf',ri(40,90),ri(200,1500)]];
  const [n,u,rate,qty]=pick(jobs),wage=rf(260,420,10),hrs=qty/rate;
  if(d<3)return {q:`A crew can ${n} at ${rate} ${u}/hr. There are ${commas(qty)} ${u} to do. How many crew-hours?`,type:'num',ans:hrs,tol:Math.max(.1,hrs*0.01),sol:`${commas(qty)} ÷ ${rate} = <b>${r1(hrs)} hours</b>.`};
  return {q:`A crew runs ${money(wage)}/hr and can ${n} at ${rate} ${u}/hr. What’s the labor cost to do ${commas(qty)} ${u}?`,type:'num',ans:hrs*wage,tol:Math.max(1,hrs*wage*0.01),sol:`Hours: ${commas(qty)} ÷ ${rate} = ${r1(hrs)}. Cost: ${r1(hrs)} × ${money(wage)} = <b>${money(hrs*wage)}</b>.`};}}
]},

{name:'Scheduling',course:'CMT 4120',lessons:[

{id:'dur',course:'CMT 4120',title:'Activity duration',bloom:'Apply',
 hint:'Duration (days) = quantity ÷ (crew output per day). Round up to whole days to plan.',
 ce:{text:'You have 1,200 cubic yards of excavation. One scraper moves 200 cy per day. How many days for one scraper?',item:{q:'Duration (days) = ?',type:'num',ans:6,sol:'1,200 ÷ 200 = <b>6 days</b>.'}},
 gni:`<div class="rule"><b>Duration</b> = quantity ÷ daily output.<br>Daily output = crew size × production per worker, or equipment output per day.<br>More crews or machines shortens duration: duration = quantity ÷ (units/day × number of crews).</div><div class="ex">6,000 sf to pave, 1,500 sf/day per paver, 2 pavers<br>6,000 ÷ (1,500 × 2) = 2 days</div>`,
 dev:'Durations are the building blocks of the schedule. Every bar on the Gantt chart is a quantity divided by a rate.',
 gen(d){const q=ri(400,6000),rate=pick([150,200,250,300,400,500]),crews=d===3?ri(1,4):1,dur=q/(rate*crews);
  if(crews===1)return {q:`${commas(q)} units of work at ${rate} units/day. How many days?`,type:'num',ans:dur,tol:Math.max(.1,dur*0.01),sol:`${commas(q)} ÷ ${rate} = <b>${r1(dur)} days</b>.`};
  return {q:`${commas(q)} units at ${rate} units/day per crew, with ${crews} crews running. How many days?`,type:'num',ans:dur,tol:Math.max(.1,dur*0.01),sol:`${commas(q)} ÷ (${rate} × ${crews}) = <b>${r1(dur)} days</b>.`};}},

{id:'cpm',course:'CMT 4120',title:'Critical path and float',bloom:'Analyze',
 hint:'The critical path is the longest path through the network. Float = how long an activity can slip without delaying the finish.',
 ce:{text:'Two parallel chains run from start to finish. Chain A: 5 + 7 + 4 days. Chain B: 6 + 8 days. What’s the project duration?',item:{q:'Project duration (days) = ?',type:'num',ans:16,sol:'Chain A = 16 days, Chain B = 14 days. The project takes the longer path: <b>16 days</b>. Chain A is critical.'}},
 gni:`<div class="rule"><b>Critical path:</b> the longest sequence of dependent activities. Its length sets the shortest possible project duration. Activities on it have zero float.</div><div class="rule"><b>Total float</b> = the slack on a non-critical activity = (duration of critical path through that point) − (duration of its own path). Slip more than the float and the end date moves.</div><div class="ex">Critical path 16 days, a parallel chain 14 days<br>that chain has 16 − 14 = 2 days of float</div>`,
 dev:'The critical path tells you which delays actually cost you the deadline and which don’t. It’s how you decide where to throw extra crews and where you can relax.',
 gen(d){const A=[ri(3,9),ri(4,10),ri(3,8)],B=[ri(4,11),ri(5,12)],sa=A.reduce((x,y)=>x+y),sb=B.reduce((x,y)=>x+y),dur=Math.max(sa,sb);
  if(d===1)return {q:`Chain A: ${A.join(' + ')} days. Chain B: ${B.join(' + ')} days. Both run start to finish in parallel. Project duration?`,type:'num',ans:dur,sol:`A = ${sa}, B = ${sb}. Longer path wins: <b>${dur} days</b>.`};
  const flo=Math.abs(sa-sb),short=sa<sb?'A':'B';return {q:`Chain A: ${A.join(' + ')} days. Chain B: ${B.join(' + ')} days, parallel. How much total float does the shorter chain (${short}) have?`,type:'num',ans:flo,sol:`A = ${sa}, B = ${sb}. The shorter chain can slip ${flo} days before it becomes critical: <b>${flo} days float</b>.`};}}
]},

{name:'Concrete and materials',course:'CMT 3000',lessons:[

{id:'wc',course:'CMT 3000',title:'Water-cement ratio and strength',bloom:'Analyze',
 hint:'w/c = weight of water ÷ weight of cement. Lower w/c means higher strength and lower workability.',
 ce:{text:'A mix uses 280 lb of water and 560 lb of cement per cubic yard. What’s the water-cement ratio?',item:{q:'w/c ratio = ?',type:'num',ans:0.5,tol:.005,sol:'280 ÷ 560 = <b>0.50</b>. A w/c around 0.45–0.50 is typical for commercial structural concrete.'}},
 gni:`<div class="rule"><b>Water-cement ratio</b> w/c = weight of water ÷ weight of cementitious material. It is the single biggest driver of concrete strength.</div><div class="rule"><b>Lower w/c → higher strength, lower slump</b> (stiffer, harder to place). Higher w/c is easier to place but weaker and more porous. Typical structural mixes run 0.40–0.50.</div><div class="ex">300 lb water, 600 lb cement<br>w/c = 300 ÷ 600 = 0.50</div>`,
 dev:'Water is the cheapest thing on the truck and the fastest way to wreck a pour. Adding water on site to make concrete “work better” is how slabs end up under strength.',
 model:'wc',
 gen(d){if(d<3){const cem=pick([470,520,560,600,640,660]),wc=pick([0.40,0.42,0.45,0.48,0.50,0.55]),w=cem*wc;return {q:`A mix has ${cem} lb cement and ${r0(w)} lb water per cy. What’s the w/c ratio?`,type:'num',ans:w/cem,tol:.01,sol:`${r0(w)} ÷ ${cem} = <b>${r2(w/cem)}</b>.`};}
  const cem=pick([520,560,600,640]),wc=pick([0.44,0.46,0.48,0.50]);return {q:`You want a ${wc} w/c ratio with ${cem} lb of cement per cy. How many pounds of water?`,type:'num',ans:cem*wc,tol:1,sol:`water = w/c × cement = ${wc} × ${cem} = <b>${r0(cem*wc)} lb</b>.`};}},

{id:'yield',course:'CMT 3000',title:'Concrete yield and batch',bloom:'Apply',
 hint:'Yield (ft³) = total batch weight ÷ unit weight. One cy = 27 ft³.',
 ce:{text:'A batch weighs 3,915 lb and the concrete’s unit weight is 145 lb/ft³. Does the batch yield a full cubic yard (27 ft³)?',item:{q:'Yield (ft³) = ?',type:'num',ans:27,tol:.3,sol:'3,915 ÷ 145 = 27.0 ft³ = exactly 1 cy. Yield checks good.'}},
 gni:`<div class="rule"><b>Yield</b> (volume produced) = total batch weight ÷ fresh unit weight.<br>Normal-weight concrete runs about 140–150 lb/ft³. A full cubic yard is 27 ft³.</div><div class="rule">If the batch yields less than 27 ft³/cy, you’re short and will run out. More than 27 and you’ve over-yielded (usually too much air or water).</div><div class="ex">4,050 lb batch, 150 lb/ft³<br>4,050 ÷ 150 = 27 ft³ = 1.0 cy</div>`,
 dev:'Yield is how you catch a bad batch before it leaves you short three trucks into a pour. It ties the batch ticket to what actually comes out of the chute.',
 gen(d){const uw=pick([140,143,145,148,150]);if(d<3){const cy=pick([1,1,2,3]),wt=uw*27*cy;return {q:`A load weighs ${commas(wt)} lb at ${uw} lb/ft³. What’s the yield in ft³?`,type:'num',ans:wt/uw,tol:.3,sol:`${commas(wt)} ÷ ${uw} = <b>${r1(wt/uw)} ft³</b> (${r2(wt/uw/27)} cy).`};}
  const need=ri(20,120),wt=uw*27,loads=need/(wt/uw/27);return {q:`You need ${need} cy. Each truck holds 1 cy batched at ${uw} lb/ft³ with good yield. Roughly how many ft³ total must the plant produce?`,type:'num',ans:need*27,tol:1,sol:`${need} cy × 27 ft³/cy = <b>${commas(need*27)} ft³</b>.`};}}
]},

{name:'Structural materials',course:'CMT 3000',lessons:[

{id:'rebar',course:'CMT 3000',title:'Rebar sizing and weight',bloom:'Apply',
 hint:'Bar number ÷ 8 = diameter in inches. A #8 is 1 inch. Weight: multiply total length by the bar’s plf.',
 ce:{text:'A footing needs 640 linear feet of #5 rebar. A #5 bar weighs 1.043 lb per foot. How much does the steel weigh?',item:{q:'Weight (lb) = ?',type:'num',ans:668,tol:2,sol:'640 ft × 1.043 lb/ft ≈ <b>668 lb</b>.'}},
 gni:`<div class="rule"><b>Bar number = eighths of an inch.</b> #4 = 4/8 = 0.5 in dia. #8 = 1.0 in. #3 = 0.375 in.</div><div class="rule"><b>Unit weights (lb/ft):</b> #3 = 0.376, #4 = 0.668, #5 = 1.043, #6 = 1.502, #7 = 2.044, #8 = 2.670, #9 = 3.400. Total weight = total length × plf. Steel is ordered by weight (lb or tons).</div><div class="ex">1,000 ft of #4<br>1,000 × 0.668 = 668 lb = 0.33 ton</div>`,
 dev:'Rebar is bought by weight but detailed by length, so every takeoff crosses this bridge. Order by the wrong bar size and the whole mat is wrong.',
 model:'rebar',
 gen(d){const bn=pick([3,4,5,6,7,8]),[dia,area,plf]=BAR[bn];
  if(d===1)return {q:`What is the diameter of a #${bn} bar, in inches?`,type:'num',ans:dia,tol:.02,sol:`#${bn} = ${bn}/8 = <b>${dia} in</b>.`};
  if(d===2){const lf=ri(200,3000);return {q:`${commas(lf)} linear feet of #${bn} bar. How much does it weigh (lb)? (#${bn} = ${plf} lb/ft)`,type:'num',ans:lf*plf,tol:Math.max(1,lf*plf*0.01),sol:`${commas(lf)} × ${plf} = <b>${commas(lf*plf)} lb</b>.`};}
  const lf=ri(1000,9000),lb=lf*plf,tons=lb/2000;return {q:`${commas(lf)} lf of #${bn} bar (${plf} lb/ft). How many tons of steel is that?`,type:'num',ans:tons,tol:Math.max(.02,tons*0.01),sol:`${commas(lf)} × ${plf} = ${commas(lb)} lb. ÷ 2,000 = <b>${r2(tons)} tons</b>.`};}},

{id:'cmu',course:'CMT 3000',title:'Masonry block and coursing',bloom:'Apply',
 hint:'Standard CMU face is 8"×16" nominal, so about 1.125 blocks per square foot. One course of block is 8 inches of height.',
 ce:{text:'A CMU wall is 40 ft long and 8 ft high. At roughly 1.125 blocks per square foot of wall, how many block do you need (before waste)?',item:{q:'Block count = ?',type:'num',ans:360,tol:5,sol:'40 × 8 = 320 sf. 320 × 1.125 = <b>360 block</b>.'}},
 gni:`<div class="rule"><b>Standard CMU:</b> 8 in high × 16 in long nominal face (includes the 3/8" mortar joint). That face is 8×16 = 128 in² = 0.889 ft², so you need about <b>1.125 block per sf</b> of wall.</div><div class="rule"><b>Coursing:</b> each course adds 8 in of height. Wall height ÷ 8 in = number of courses. 3 courses = 24 in = 2 ft.</div><div class="ex">A 24 ft × 10 ft wall<br>240 sf × 1.125 = 270 block<br>10 ft = 120 in ÷ 8 = 15 courses</div>`,
 dev:'Block and coursing drive masonry takeoff and layout. Coursing also tells you where openings land without fighting the module.',
 gen(d){const L=ri(16,80),H=pick([8,8.67,10,12,16]);
  if(d===1){const courses=Math.round(H*12/8);return {q:`A CMU wall is ${H} ft high. How many 8-inch courses is that?`,type:'num',ans:H*12/8,tol:.3,sol:`${H} ft = ${H*12} in ÷ 8 in/course = <b>${r1(H*12/8)} courses</b>.`};}
  const sf=L*H,blk=sf*1.125;if(d===2)return {q:`A CMU wall is ${L} ft × ${H} ft. At 1.125 block/sf, how many block (before waste)?`,type:'num',ans:blk,tol:5,sol:`${L} × ${H} = ${r0(sf)} sf. × 1.125 = <b>${r0(blk)} block</b>.`};
  const waste=pick([3,5]),ord=blk*(1+waste/100);return {q:`A ${L} ft × ${H} ft CMU wall at 1.125 block/sf, plus ${waste}% waste. How many block do you order?`,type:'num',ans:ord,tol:6,sol:`${r0(sf)} sf × 1.125 = ${r0(blk)} block. +${waste}% = <b>${r0(ord)} block</b>.`};}}
]},

{name:'Soils, safety and site',course:'CMT 2320 / CCM 2200',lessons:[

{id:'compact',course:'CMT 2320',title:'Compaction and Proctor density',bloom:'Analyze',
 hint:'Relative compaction = field dry density ÷ maximum (Proctor) dry density × 100. Specs usually want 95%.',
 ce:{text:'A Proctor test gives a maximum dry density of 120 lb/ft³. A field nuclear gauge reads 114 lb/ft³. What percent compaction did you hit?',item:{q:'Relative compaction (%) = ?',type:'num',ans:95,tol:.3,sol:'114 ÷ 120 = 0.95 = <b>95%</b>. That meets a typical 95% spec.'}},
 gni:`<div class="rule"><b>Relative compaction</b> = (field dry density ÷ maximum dry density) × 100.<br>Maximum dry density comes from a Proctor test (lab). Field density comes from a nuclear gauge or sand cone.</div><div class="rule">Most structural fill and subgrade specs call for <b>95%</b> of the standard Proctor. Fail it and the fill gets reworked and re-rolled before anything goes on top.</div><div class="ex">Max 118 lb/ft³, field 112 lb/ft³<br>112 ÷ 118 = 94.9% — just short of 95%</div>`,
 dev:'Compaction testing is pass/fail gating on every pad, footing, and pavement subgrade. A failed test stops the next trade cold, so the math decides the schedule.',
 model:'compact',
 gen(d){const max=pick([112,115,118,120,122,125,128]);
  if(d<3){const rc=pick([92,94,95,96,98]),field=max*rc/100;return {q:`Proctor max is ${max} lb/ft³. The field reads ${r1(field)} lb/ft³. What percent compaction?`,type:'num',ans:field/max*100,tol:.3,sol:`${r1(field)} ÷ ${max} = <b>${pct(field/max*100)}</b>.`};}
  const spec=95,need=max*spec/100;return {q:`Proctor max is ${max} lb/ft³ and the spec is ${spec}%. What field dry density must you hit, in lb/ft³?`,type:'num',ans:need,tol:.5,sol:`${spec}% × ${max} = <b>${r1(need)} lb/ft³</b> minimum.`};}},

{id:'slope',course:'CCM 2200',title:'OSHA excavation slope ratios',bloom:'Apply',
 hint:'For Type B soil, OSHA requires a 1:1 slope (1 ft back for every 1 ft deep). Width added each side = depth × the horizontal ratio.',
 ce:{text:'A trench is 8 ft deep in Type B soil, which OSHA slopes at 1:1 (horizontal:vertical). How far back must each side be cut from the trench edge?',item:{q:'Horizontal cutback each side (feet) = ?',type:'num',ans:8,sol:'1:1 means 1 ft back per 1 ft deep. 8 ft deep × 1 = <b>8 ft</b> each side.'}},
 gni:`<div class="rule"><b>OSHA sloping</b> protects against cave-ins in trenches 5 ft or deeper (29 CFR 1926 Subpart P). The max allowable slope depends on soil type:<br>Type A: 0.75:1 (¾ ft back per ft deep)<br>Type B: 1:1<br>Type C: 1.5:1</div><div class="rule">Cutback each side = depth × horizontal ratio. Top width = bottom width + 2 × cutback.</div><div class="ex">6 ft deep, Type C (1.5:1)<br>cutback = 6 × 1.5 = 9 ft each side</div>`,
 dev:'This is life-safety, not just layout. Trench collapse is one of the top killers in construction, and these ratios are federally enforced. It also drives how much you excavate and haul.',
 gen(d){const soils=[['A',0.75],['B',1],['C',1.5]],[t,r]=pick(soils),dep=d===1?pick([5,6,8,10]):rf(5,16,0.5);
  if(d<3)return {q:`A trench is ${dep} ft deep in Type ${t} soil (OSHA slope ${r}:1). How far back must each side be sloped?`,type:'num',ans:dep*r,tol:.1,sol:`${dep} × ${r} = <b>${r1(dep*r)} ft</b> each side.`};
  const bw=ri(3,8),top=bw+2*dep*r;return {q:`A ${dep} ft deep trench in Type ${t} soil (${r}:1), ${bw} ft wide at the bottom. How wide is the top of the excavation?`,type:'num',ans:top,tol:.2,sol:`Cutback ${r1(dep*r)} ft each side. Top = ${bw} + 2 × ${r1(dep*r)} = <b>${r1(top)} ft</b>.`};}}
]},

{name:'BIM and closeout',course:'CMT 4320 / CMT 4280',lessons:[

{id:'bim',course:'CMT 4320',title:'Model quantities and LOD',bloom:'Understand',
 hint:'BIM pulls quantities straight from the model. Level of Development (LOD) says how reliable that geometry and data is.',

      const nb=h('button',{class:'btn primary',hidden:true,onclick:nextProb},'Next problem');
      const wi=itemWidget(item,{onResult:ok=>{L.att++;if(ok)L.cor++;L.hist.push(ok?1:0);L.hist=L.hist.slice(-20);const l5=L.hist.slice(-5);if(!L.go&&L.hist.length>=5&&l5.reduce((a,b)=>a+b,0)>=4){L.go=true;showGo(true);}save();updStat();refresh();nb.hidden=false;sb.disabled=true;nb.focus({preventScroll:true});}});
      sb=h('button',{class:'btn ghost',onclick:()=>wi.reveal()},'Show solution');
      slot.append(wi,h('div',{class:'row'},h('button',{class:'btn ghost',onclick:()=>hint.hidden=false},'Hint'),sb,nb),hint);}
    function showGo(fresh){goBox.replaceChildren(h('div',{class:'banner'},h('strong',{},fresh?'GO. Standard met.':'This module is at GO.'),h('span',{},' Keep running reps, or close it out with an after action review.')),aar(l));}
    updStat();nextProb();if(L.go)showGo(false);}
  app.append(stepper,panel);
  const i=LESSONS.indexOf(l),pv=LESSONS[i-1],nx=LESSONS[i+1];
  app.append(h('div',{class:'row between lnav'},pv?h('button',{class:'btn ghost',onclick:()=>go('lesson',pv.id)},'← '+pv.num):h('span'),nx?h('button',{class:'btn ghost',onclick:()=>go('lesson',nx.id)},nx.num+' →'):h('span')));
  show(L.step||0);
}
function aar(l){const qs=['What was supposed to happen?','What actually happened?','Why the difference?','Sustain / improve?'],tas=qs.map(()=>h('textarea',{rows:2}));
  const box=h('div',{class:'aar'},h('h3',{},'After action review'),qs.map((q,i)=>h('label',{class:'field'},h('span',{},q),tas[i])),h('div',{class:'row'},h('button',{class:'btn primary',onclick:()=>{if(!tas.some(t=>t.value.trim()))return;S.journal.push({id:l.id,date:new Date().toISOString(),aar:tas.map(t=>t.value)});save();box.replaceChildren(h('p',{class:'callout okc'},'AAR saved to your log.'));}},'Save AAR')));return box;}

/* ===== journal ===== */
function vJournal(app){app.append(h('h1',{class:'ph'},'Field log'),h('p',{class:'lead'},'Your reflections, connections, and after action reviews, by module.'));
  const rows=[];LESSONS.forEach(l=>{const L=S.lessons[l.id],aars=S.journal.filter(j=>j.id===l.id);if(!((L&&(L.pp.trim()||L.dev.trim()))||aars.length))return;
    const card=h('div',{class:'panel jcard'},h('h3',{},`${l.num} · ${l.title}`,h('span',{class:'chip course'},l.course)));
    if(L&&L.pp.trim())card.append(h('p',{class:'jl'},'Reflection'),h('p',{class:'jt'},L.pp));
    if(L&&L.dev.trim())card.append(h('p',{class:'jl'},'Where I’ll use it'),h('p',{class:'jt'},L.dev));
    aars.forEach(a=>card.append(h('p',{class:'jl'},'AAR · '+new Date(a.date).toLocaleDateString()),h('ol',{class:'jt'},a.aar.map(x=>h('li',{},x||'—')))));rows.push(card);});
  if(!rows.length){app.append(h('p',{class:'callout'},'Nothing logged yet. Your notes from the Reflect and Connect steps, plus any AARs, collect here.'),h('button',{class:'btn primary',onclick:()=>go('lesson',nextLesson().id)},'Open the next module'));return;}
  const txt=()=>LESSONS.map(l=>{const L=S.lessons[l.id],a=S.journal.filter(j=>j.id===l.id);if(!((L&&(L.pp.trim()||L.dev.trim()))||a.length))return '';return `== ${l.num} ${l.title} (${l.course}) ==\n`+(L&&L.pp.trim()?`Reflection: ${L.pp}\n`:'')+(L&&L.dev.trim()?`Use: ${L.dev}\n`:'')+a.map(x=>`AAR ${x.date.slice(0,10)}:\n${x.aar.map((v,i)=>`  ${i+1}. ${v}`).join('\n')}\n`).join('');}).filter(Boolean).join('\n');
  const msg=h('span',{class:'small'});app.append(h('div',{class:'row'},h('button',{class:'btn',onclick:async()=>{try{await navigator.clipboard.writeText(txt());msg.textContent='Copied.';}catch(e){const t=h('textarea',{class:'copybox',readonly:true});t.value=txt();msg.replaceWith(t);t.select();}}},'Copy log as text'),msg),rows);}

/* ===== method ===== */
function vMethod(app){app.append(h('h1',{class:'ph'},'How this works'),h('div',{class:'panel gni',html:`
<p>Field Ops teaches the working math behind MTSU’s Commercial Construction Management concentration. Each module is tied to a real course in the degree and built on the Army Experiential Learning Model (ELM) with andragogy, GO/NO-GO standards, and after action reviews.</p>
<h3>Modules by course</h3>
<div class="rule"><b>CCM 2060 / CMT 2100</b> — reading scale, area and volume takeoff, 3-4-5 squaring.<br><b>CMT 3100 / CMT 4200</b> — unit-cost estimating, markup vs. margin, labor productivity.<br><b>CMT 4120</b> — activity duration, critical path and float.<br><b>CMT 3000</b> — water-cement ratio, yield, rebar, masonry coursing.<br><b>CMT 2320 / CCM 2200</b> — compaction and Proctor, OSHA trench sloping.<br><b>CMT 4320 / CMT 4280</b> — BIM and LOD, progress billing and retainage.</div>
<h3>The five ELM steps, every module</h3>
<div class="rule"><b>1. Run it cold.</b> A field scenario you attempt before instruction.<br><b>2. Reflect.</b> You see the answer and write what happened.<br><b>3. The method.</b> The rule, a worked example, and an interactive model to play with.<br><b>4. Connect it.</b> Where you’ll use it, in your own words.<br><b>5. Train to GO.</b> Generated problems that step up until you meet the standard.</div>
<h3>Standard and AAR</h3>
<p>A module is GO at 4 of your last 5, with at least 5 reps. Showing a solution counts as a NO-GO. At GO, a four-question AAR captures sustain/improve and saves to your field log. Bloom’s level is tagged on each module.</p>
<h3>Honest note on numbers</h3>
<p>Course numbers and sequencing follow the MTSU 2026–27 Commercial CM academic map. The engineering values (rebar weights, Proctor relationships, OSHA slope ratios, w/c behavior) are standard industry references; always verify against the current ACI, OSHA 1926 Subpart P, and project specs before using them on a real job.</p>`}),h('div',{class:'row'},h('button',{class:'btn primary',onclick:()=>go('lesson',nextLesson().id)},'Open the next module')));}

document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
render();
</script></body></html>
